steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/eurobase'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/eurobase'
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'eurobase'
      - '--image'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/eurobase'
      - '--region'
      - 'europe-west1'
      - '--port'
      - '8080'
      # Public access (allUsers -> roles/run.invoker) is bound separately
      # via `gcloud run services add-iam-policy-binding`. Keeping the flag
      # here triggers a benign org-policy warning on every deploy because
      # the binding is already in place.
