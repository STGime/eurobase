server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never emit `http://…:8080/…` in a redirect Location — Cloud Run
    # terminates TLS at the edge and speaks HTTP to the container, so
    # `$scheme` is always "http" and `$server_port` is 8080 from the
    # container's perspective. Without these directives, ANY nginx-
    # generated redirect (e.g. the automatic trailing-slash redirect
    # from `try_files $uri $uri/`) sends Googlebot to a bare-http URL
    # on port 8080 that the public internet cannot reach. Both flags
    # make nginx emit a scheme-relative + port-less Location so the
    # client's own scheme/host survive.
    absolute_redirect off;
    port_in_redirect off;

    # Canonicalize host + scheme so Googlebot never discovers a
    # duplicate URL. Fixes the Search Console "Alternate page with
    # proper canonical tag" pile (24 URLs) that came from
    # www.eurobase.app / http://... serving 200 for every route.
    # Cloud Run terminates TLS at its front-end and forwards HTTP
    # to the container with the original scheme in
    # X-Forwarded-Proto — so we branch on that header, not on
    # $scheme (which is always "http" from the container's view and
    # would 301-loop). Still correct after the Scaleway Serverless
    # Container cutover: Scaleway's edge has the same shape (TLS at
    # the edge, forwarded scheme in X-Forwarded-Proto).
    if ($host = "www.eurobase.app") {
        return 301 https://eurobase.app$request_uri;
    }
    if ($http_x_forwarded_proto = "http") {
        return 301 https://eurobase.app$request_uri;
    }

    # SPA fallback — vite-ssg emits /pricing/index.html,
    # /blog/<slug>/index.html, etc. Serve `$uri/index.html` directly
    # (NOT `$uri/`) so nginx never has to issue a trailing-slash
    # redirect. The old `$uri/` alternative triggered nginx's
    # automatic 301 that leaked http:// + :8080 into the Location
    # header, breaking every SPA route in Google's index. The
    # /index.html final fallback covers slugs we didn't pre-render
    # (unknown route → soft 404; a real 404 page is a follow-up).
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
}
