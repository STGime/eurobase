server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Canonicalize host + scheme so Googlebot never discovers a
    # duplicate URL. Fixes the Search Console "Alternate page with
    # proper canonical tag" pile (24 URLs) that came from
    # www.eurobase.app / http://... serving 200 for every route.
    # Cloud Run terminates TLS at its front-end and forwards HTTP
    # to the container with the original scheme in
    # X-Forwarded-Proto — so we branch on that header, not on
    # $scheme (which is always "http" from the container's view and
    # would 301-loop). Still correct after the Scaleway Serverless
    # Container cutover: Scaleway's edge has the same shape (TLS at
    # the edge, forwarded scheme in X-Forwarded-Proto).
    if ($host = "www.eurobase.app") {
        return 301 https://eurobase.app$request_uri;
    }
    if ($http_x_forwarded_proto = "http") {
        return 301 https://eurobase.app$request_uri;
    }

    # SPA fallback — vite-ssg emits /pricing/index.html,
    # /blog/<slug>/index.html, etc., so $uri/ hits the pre-rendered
    # HTML directly. Fallback to /index.html is only exercised for
    # slugs we didn't pre-render (unknown route → soft 404 for now;
    # a real 404 page lands in a follow-up).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
}
