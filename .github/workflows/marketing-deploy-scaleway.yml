# Build the marketing site container, push it to Scaleway Container Registry,
# and deploy to a Scaleway Serverless Container in fr-par.
#
# Sovereignty cutover Phase 1a. See docs/runbooks/sovereignty-cutover.md in
# the euroback repo. This workflow does NOT wire the container to
# eurobase.app — that happens in Phase 2a after the preview endpoint has
# been smoke-tested.
#
# ---
# One-time bootstrap (before this workflow can run):
#   1. Create Container Registry namespace:
#        scw registry namespace create name=eurobase-marketing region=fr-par
#   2. Create Serverless Containers namespace:
#        scw container namespace create name=eurobase-marketing region=fr-par
#   3. Create the Serverless Container (initial deploy uses a placeholder
#      image; the first workflow run replaces it with the real one):
#        scw container container create \
#          namespace-id=<from-step-2> \
#          name=eurobase-marketing \
#          registry-image=rg.fr-par.scw.cloud/eurobase-marketing/eurobase:bootstrap \
#          port=8080 \
#          min-scale=0 max-scale=3 \
#          memory-limit=512 \
#          region=fr-par
#   4. Add the container ID to the SCW_CONTAINER_ID GitHub secret.
#   5. Push a bootstrap image once (locally) so the container has something
#      to deploy on its first workflow run — or accept that the first push
#      to main after this PR merges will fail once and succeed on rerun.
#
# ---
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   SCW_ACCESS_KEY               — Scaleway API access key (starts SCW…)
#   SCW_SECRET_KEY               — Scaleway API secret key (UUID)
#   SCW_DEFAULT_ORGANIZATION_ID  — organization ID (UUID)
#   SCW_DEFAULT_PROJECT_ID       — project ID (UUID)
#   SCW_CONTAINER_ID             — container ID from bootstrap step 3 (UUID)

name: Deploy marketing site (Scaleway)

on:
  # Manual-only until the container is bootstrapped and preview-verified.
  # After Phase 1a smoke-test passes, add:
  #   push:
  #     branches: [main]
  workflow_dispatch:

# Serialize deploys so two dispatches (or two rapid merges once push:main
# is enabled) can't race and leave the older sha live. cancel-in-progress
# is false because cancelling mid-deploy leaves the container in a bad
# state — let each deploy finish, then run the newer one.
concurrency:
  group: scaleway-marketing-deploy
  cancel-in-progress: false

env:
  SCW_REGION: fr-par
  CR_NAMESPACE: eurobase-marketing
  IMAGE_NAME: eurobase
  SCW_VERSION: "2.41.0"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Job-level env — scw reads these directly, no need to configure a
    # config file. Applied to every step.
    env:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      SCW_DEFAULT_REGION: fr-par

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: rg.${{ env.SCW_REGION }}.scw.cloud/${{ env.CR_NAMESPACE }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            rg.${{ env.SCW_REGION }}.scw.cloud/${{ env.CR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            rg.${{ env.SCW_REGION }}.scw.cloud/${{ env.CR_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pinned binary from the tagged GitHub release. Not `curl … master |
      # sh` — that pipes whatever master serves today into a shell that
      # then holds SCW_SECRET_KEY. Version check after install fails loud
      # if the binary isn't the pinned version.
      - name: Install Scaleway CLI (pinned v${{ env.SCW_VERSION }})
        run: |
          curl -fsSL -o /tmp/scw \
            "https://github.com/scaleway/scaleway-cli/releases/download/v${SCW_VERSION}/scaleway-cli_${SCW_VERSION}_linux_amd64"
          chmod +x /tmp/scw
          sudo mv /tmp/scw /usr/local/bin/scw
          scw version | tee /dev/stderr | grep -q "v${SCW_VERSION}" \
            || { echo "scw version pin mismatch"; exit 1; }

      # Real credential check — `scw config dump` exits 1 on a fresh runner
      # because no config file exists (env-only auth is fine but dump wants
      # the file). `account project get` actually calls the API and
      # verifies the four SCW_* env vars are valid.
      - name: Verify Scaleway credentials
        run: scw account project get ${{ secrets.SCW_DEFAULT_PROJECT_ID }}

      # Single synchronization point. `update registry-image=…` changes the
      # container's image and, since the container is running, Scaleway
      # queues a redeploy automatically. `--wait` blocks until the container
      # reaches a terminal state (ready or error). No second `deploy` call
      # (that races with the implicit redeploy) and no hand-rolled poll
      # (which false-greens on stale "ready" and hides "error").
      - name: Update image and wait for deploy
        run: |
          scw container container update ${{ secrets.SCW_CONTAINER_ID }} \
            registry-image=rg.${SCW_REGION}.scw.cloud/${CR_NAMESPACE}/${IMAGE_NAME}:${GITHUB_SHA} \
            --wait
          # `--wait` returns 0 on terminal state, not necessarily healthy —
          # confirm the terminal state is `ready`, print API error_message
          # if not.
          status=$(scw container container get ${{ secrets.SCW_CONTAINER_ID }} -o json | jq -r .status)
          echo "post-deploy status=$status"
          if [ "$status" != "ready" ]; then
            scw container container get ${{ secrets.SCW_CONTAINER_ID }} -o json \
              | jq -r '"error_message: " + (.error_message // "(none)")'
            exit 1
          fi

      - name: Smoke-test the deployed container
        run: |
          endpoint=$(scw container container get ${{ secrets.SCW_CONTAINER_ID }} -o json | jq -r .domain_name)
          echo "endpoint=https://$endpoint"
          curl -fsS -I "https://$endpoint/" | head -5
          curl -fsS "https://$endpoint/" | grep -q '<title>Eurobase' \
            || { echo "index did not render the expected title"; exit 1; }
